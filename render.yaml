# Render Blueprint for the SalesMotion API.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file and creates the service. The secrets marked `sync: false` are left
# blank on purpose and must be pasted into the dashboard once — they are never
# committed to the repo.
#
# The frontend is NOT defined here; it deploys separately on Cloudflare Pages.

services:
  - type: web
    name: salesmotion-api
    runtime: node
    # Free instances are available in every region. oregon is the default;
    # singapore or frankfurt will be noticeably faster from India/Europe.
    region: oregon
    # Free plan: no card required, but the instance spins down after ~15 minutes
    # with no inbound traffic. Two consequences to know about:
    #   1. The first request after a sleep takes ~50s while it wakes back up.
    #   2. A report still generating when it sleeps is lost — reportSweeper marks
    #      it 'failed' with a "run it again" message rather than leaving it stuck
    #      on 'pending' forever, so nothing hangs, but the work is wasted.
    # Change to `starter` (paid) to remove both. Nothing else needs to change.
    plan: free
    rootDir: backend
    # --omit=dev keeps jest and nodemon out of the running image: smaller, faster
    # to build, and nothing dev-only can be reached from production.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    # A 503 here (database unreachable) marks the instance unhealthy so Render
    # replaces it instead of leaving it up failing every request.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects the real port at runtime; the app reads process.env.PORT.
      - key: PORT
        value: 5000

      # Generated once by Render and kept stable across deploys. Rotating it
      # signs every existing login out, so do not regenerate casually.
      - key: JWT_SECRET
        generateValue: true

      # --- Paste these in the dashboard (never committed) --------------------
      # MongoDB Atlas connection string. Atlas must allow Render's outbound IPs
      # (Network Access -> Add IP Address), or the process exits on boot.
      - key: MONGODB_URI
        sync: false

      # The deployed frontend origin. Comma-separate to allow more than one.
      # A wildcard entry covers Cloudflare Pages preview builds, e.g.
      #   https://salesmotion.pages.dev,https://*.salesmotion.pages.dev
      # Anything not listed is refused by CORS.
      - key: FRONTEND_URL
        sync: false

      # Azure OpenAI - the primary provider. All three must be set in the Render
      # dashboard or the chain silently falls through to Groq.
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false

      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      # Earnings-call transcripts are a PAID Finnhub endpoint. Set to "true"
      # only once the plan covers them; the code path stays dormant otherwise
      # and everything else degrades gracefully without it.
      - key: FINNHUB_PREMIUM
        value: "false"

      # Patents, for accounts tagged R&D-heavy. USPTO retired its keyless API;
      # the replacement key is FREE, from developer.uspto.gov. Set either one.
      # With neither, the patent block is simply absent - nothing is estimated.
      - key: USPTO_API_KEY
        sync: false
      - key: PATENTSVIEW_API_KEY
        sync: false

      # Evidence crawl. One crawl per report and per nightly signal sweep, read
      # by the sources list, the record extractors and the signals feed. Every
      # source here is keyless; these only cap how much is fetched.
      - key: MAX_CRAWL_ARTICLES
        value: "100"
      - key: MAX_NEWS_SOURCES
        value: "30"
      - key: MAX_JOB_SOURCES
        value: "8"
      - key: MAX_FILING_SOURCES
        value: "5"
      - key: MAX_PRESS_HOSTS
        value: "6"
      - key: MAX_REGULATOR_HOSTS
        value: "4"
      - key: CRAWL_WINDOW_DAYS
        value: "90"
      # Under this a report still generates, but says on its face that it was
      # written thin rather than reading as confident as a well-sourced one
      - key: THIN_COVERAGE_FLOOR
        value: "15"

      # Audit trail behind the admin Analytics page. Entries expire after this
      # many days; the TTL index is re-pointed on boot when the value changes.
      - key: ACTIVITY_LOG_RETENTION_DAYS
        value: "365"

      # Nightly signal sweep. Reports stay on demand; only signals refresh on
      # their own. In-process, so a sweep fires only while an instance is awake
      # - the boot run is what catches up after the host idles it to sleep.
      - key: SIGNAL_SWEEP_INTERVAL_MS
        value: "86400000"
      - key: SIGNAL_SWEEP_BOOT_DELAY_MS
        value: "120000"
      - key: SIGNAL_MAX_AI_PER_COMPANY
        value: "10"

      # Company suggestions in "Add an account". Leave blank and the search box
      # falls back to Wikipedia/Wikidata alone.
      - key: LOGODEV_SECRET_KEY
        sync: false
      - key: LOGODEV_PUBLISHABLE_KEY
        sync: false

      # Company suggestions plus firmographics for the private accounts
      # Wikidata has no record of.
      - key: BRANDFETCH_CLIENT_ID
        sync: false
      - key: BRANDFETCH_API_KEY
        sync: false

      # Optional SQL store. Leave blank and the app boots with it disabled.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # --- Tunables (same defaults as the code) ------------------------------
      - key: PROVIDER_ORDER
        value: azure,groq,gemini
      - key: AZURE_OPENAI_API_VERSION
        value: 2024-10-21
      # Optional: the underlying model behind the deployment, e.g. gpt-5.
      # Labels the report and picks the parameter style.
      - key: AZURE_OPENAI_MODEL
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
